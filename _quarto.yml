project:
  type: website
  output-dir: _site

website:
  title: "Luis Alfredo López Gonzales"
  description: "Portafolio profesional y Currículum Vitae"
  navbar:
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Currículum (CV)"
        href: content/cv.qmd
    right:
      - icon: github
        href: https://github.com/lalgonzales
      - icon: linkedin
        href: https://linkedin.com/in/lalgonzales/
  page-footer:
    center:
      - text: "Privacidad"
        href: content/privacidad.qmd
  cookie-consent:
    type: express
    style: simple
    palette: light
    language: es
    prefs-text: "Preferencias de cookies"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: content/cv.css
    toc: true
    toc-title: "En esta página"
    include-in-header:
      text: |
        <!-- Google Tag Manager -->
        <script type="text/plain" cookie-consent="tracking">(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-MC5WJHK2');</script>
        <!-- End Google Tag Manager -->

execute:
  freeze: auto
